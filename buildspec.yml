version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
  pre_build:
    commands:
      - echo Installing dependencies...
      - python3.12 -m pip install -r requirements.txt
      - python3.12 -m pip install pytest pytest-cov
  build:
    commands:
      - echo Running tests...
      - export PYTHONPATH=.
      - python3.12 -m pytest tests/ --cov=app
      - echo Building the application...
      - python3.12 -m pip install wheel
      - python3.12 setup.py bdist_wheel
  post_build:
    commands:
      - echo Build completed on `date`

artifacts:
  files:
    - appspec.yml
    - app.py
    - templates/**/*
    - requirements.txt
    - scripts/**/*
    - dist/**/*
  discard-paths: no
